[project]
name = "pose-autoresearch"
version = "0.2.0"
description = "Autonomous research for pose-based event detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",  # For YOLO pose estimation
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "matplotlib",
    "seaborn",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
