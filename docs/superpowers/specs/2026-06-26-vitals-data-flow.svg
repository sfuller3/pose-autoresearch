<svg width="100%" viewBox="0 0 680 590" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Camera data flow for vitals, pose, and privacy display</title>
<desc>Full-resolution video splits to a local rotating buffer and the vitals path, while a downscaled copy drives pose estimation, which fans out to fall detection, liveness, privacy display, and face ROI selection.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5F5E5A"/></marker>
<marker id="ahc" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D85A30"/></marker>
</defs>
<g class="c-gray"><rect x="40" y="12" width="11" height="11" rx="2"/></g>
<text class="ts" x="56" y="21">capture / storage</text>
<g class="c-purple"><rect x="178" y="12" width="11" height="11" rx="2"/></g>
<text class="ts" x="194" y="21">pose</text>
<g class="c-teal"><rect x="246" y="12" width="11" height="11" rx="2"/></g>
<text class="ts" x="262" y="21">consumers</text>
<g class="c-coral"><rect x="350" y="12" width="11" height="11" rx="2"/></g>
<text class="ts" x="366" y="21">vitals (rPPG)</text>
<g class="c-gray"><rect x="270" y="48" width="140" height="46" rx="8"/><text class="th" x="340" y="72" text-anchor="middle">Camera</text><text class="ts" x="340" y="88" text-anchor="middle">1080p · 30 fps</text></g>
<path d="M300,94 L130,128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M340,94 L340,128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="452" y="66">full-res pixels</text>
<path d="M410,71 H620 V394" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ahc)"/>
<g class="c-gray"><rect x="40" y="132" width="152" height="46" rx="8"/><text class="th" x="116" y="156" text-anchor="middle">Full-res buffer</text><text class="ts" x="116" y="171" text-anchor="middle">rotating · review</text></g>
<g class="c-gray"><rect x="264" y="132" width="152" height="46" rx="8"/><text class="th" x="340" y="156" text-anchor="middle">Downscale</text><text class="ts" x="340" y="171" text-anchor="middle">to 320 / 640</text></g>
<path d="M340,178 L340,212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="255" y="216" width="170" height="46" rx="8"/><text class="th" x="340" y="240" text-anchor="middle">Pose + tracking</text><text class="ts" x="340" y="255" text-anchor="middle">YOLO11-pose · BoT-SORT</text></g>
<path d="M322,262 L122,296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M334,262 L255,296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M348,262 L399,296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M362,262 L533,296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="44" y="300" width="130" height="54" rx="8"/><text class="th" x="109" y="324" text-anchor="middle">Fall detection</text><text class="ts" x="109" y="340" text-anchor="middle">events + alerts</text></g>
<g class="c-teal"><rect x="188" y="300" width="130" height="54" rx="8"/><text class="th" x="253" y="324" text-anchor="middle">Liveness</text><text class="ts" x="253" y="340" text-anchor="middle">+ activity</text></g>
<g class="c-teal"><rect x="332" y="300" width="130" height="54" rx="8"/><text class="th" x="397" y="324" text-anchor="middle">Privacy display</text><text class="ts" x="397" y="340" text-anchor="middle">shapes only</text></g>
<g class="c-purple"><rect x="476" y="300" width="130" height="54" rx="8"/><text class="th" x="541" y="324" text-anchor="middle">Face ROI</text><text class="ts" x="541" y="340" text-anchor="middle">forehead / cheeks</text></g>
<path d="M541,354 L528,396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="548" y="382">coords ×scale</text>
<g class="c-coral"><rect x="420" y="400" width="210" height="50" rx="8"/><text class="th" x="525" y="424" text-anchor="middle">rPPG estimator</text><text class="ts" x="525" y="440" text-anchor="middle">green (day) / NIR (night)</text></g>
<path d="M525,450 L525,484" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-coral"><rect x="420" y="488" width="210" height="46" rx="8"/><text class="th" x="525" y="512" text-anchor="middle">HR / RR</text><text class="ts" x="525" y="527" text-anchor="middle">vitals log + alerts</text></g>
<text class="ts" x="40" y="558">Live view shows privacy shapes only — never raw video.</text>
<text class="ts" x="40" y="576">Full-res: local buffer + vitals sampling, not displayed live.</text>
</svg>
